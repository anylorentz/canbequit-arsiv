<!DOCTYPE html>
<html lang="tr">
<head>

  <title>canbequit | Kick VOD Platformu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070809;
      --bg-elevated: #0f1214;
      --surface: #14181b;
      --surface-hover: #1c2226;
      --border: #232a2f;
      --kick: #53fc18;
      --kick-hover: #45db10;
      --kick-glow: rgba(83, 252, 24, 0.18);
      --kick-subtle: rgba(83, 252, 24, 0.08);
      --danger: #ff3b5c;
      --text: #f3f5f7;
      --text-dim: #9ba3ab;
      --text-muted: #656e77;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Kick-style Top Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 64px;
      background: rgba(11, 14, 15, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      gap: 1rem;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .kick-logo {
      background: var(--kick);
      color: #000;
      font-weight: 900;
      font-size: 1rem;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 18px var(--kick-glow);
    }

    .channel-pill {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.3rem 0.75rem 0.3rem 0.35rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #53fc18, #128000);
      color: #000;
      font-weight: 900;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--kick);
    }

    .channel-name {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
    }

    .verified-icon {
      color: var(--kick);
      display: inline-flex;
      align-items: center;
    }

    .nav-center {
      flex: 1;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-wrapper input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 999px;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
      user-select: text;
      -webkit-user-select: text;
    }

    .search-wrapper input:focus {
      border-color: var(--kick);
      box-shadow: 0 0 0 3px var(--kick-glow);
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .sort-select:focus {
      border-color: var(--kick);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-kick {
      background: var(--kick);
      color: #000;
      font-weight: 800;
      font-size: 0.84rem;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      transition: all 0.18s;
    }

    .btn-kick:hover {
      background: var(--kick-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--kick-glow);
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.84rem;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.18s;
    }

    .btn-ghost:hover, .btn-ghost.active {
      border-color: var(--kick);
      color: var(--kick);
    }

    /* YouTube Watch Layout (2 Columns) */
    .watch-container {
      max-width: 1720px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 3rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 410px;
      gap: 1.5rem;
      align-items: start;
    }

    .watch-container.theater-mode {
      grid-template-columns: 1fr;
    }

    /* Primary Column: Video Player + Info */
    .primary-col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .player-shell {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
    }

    .watch-container.theater-mode .player-shell {
      padding-top: 0;
      height: 76vh;
    }

    .player-shell iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Security blocker over Google Drive's top-right "pop-out / open in Drive" icon */
    .popout-shield {
      position: absolute;
      top: 0;
      right: 0;
      width: 76px;
      height: 64px;
      z-index: 25;
      background: transparent;
      cursor: default;
    }

    /* Dynamic Watermark (Udemy style deterrence) */
    .security-watermark {
      position: absolute;
      top: 16px;
      left: 18px;
      z-index: 20;
      pointer-events: none;
      background: rgba(7, 8, 9, 0.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(83, 252, 24, 0.3);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .security-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--kick);
      box-shadow: 0 0 8px var(--kick);
    }

    /* Video Meta Below Player (YouTube + Kick Hybrid) */
    .video-details-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .video-main-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .tag-kick {
      background: var(--kick-subtle);
      color: var(--kick);
      border: 1px solid rgba(83, 252, 24, 0.35);
      font-size: 0.74rem;
      font-weight: 800;
      padding: 0.22rem 0.6rem;
      border-radius: 6px;
      letter-spacing: 0.03em;
    }

    .tag-neutral {
      background: var(--bg-elevated);
      color: var(--text-dim);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.22rem 0.6rem;
      border-radius: 6px;
    }

    .channel-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
    }

    .streamer-info {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .streamer-avatar-lg {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #53fc18, #0e6b00);
      color: #000;
      font-weight: 900;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--kick);
      box-shadow: 0 0 14px var(--kick-glow);
    }

    .streamer-text h3 {
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .streamer-text p {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .player-controls-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    /* Secondary Column: YouTube-Style Up Next Playlist */
    .secondary-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 96px);
      position: sticky;
      top: 80px;
    }

    .watch-container.theater-mode .secondary-col {
      position: static;
      max-height: none;
    }

    .playlist-header {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-elevated);
    }

    .playlist-title {
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .playlist-count {
      background: var(--kick);
      color: #000;
      font-size: 0.74rem;
      font-weight: 900;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    .playlist-scroll {
      overflow-y: auto;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .playlist-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .playlist-scroll::-webkit-scrollbar-thumb {
      background: #2b333a;
      border-radius: 999px;
    }

    /* YouTube Compact Horizontal Card */
    .upnext-card {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 0.75rem;
      padding: 0.5rem;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.16s ease;
      background: transparent;
    }

    .upnext-card:hover {
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .upnext-card.active {
      background: rgba(83, 252, 24, 0.09);
      border-color: var(--kick);
    }

    .upnext-thumb {
      position: relative;
      width: 150px;
      height: 84px;
      border-radius: 8px;
      background: radial-gradient(circle at 25% 25%, #1f3518 0%, #0b0e10 75%);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .upnext-play-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(83, 252, 24, 0.92);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s;
    }

    .upnext-card:hover .upnext-play-icon {
      transform: scale(1.1);
    }

    .upnext-badge-hd {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.85);
      color: var(--kick);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.1rem 0.38rem;
      border-radius: 4px;
    }

    .upnext-badge-playing {
      position: absolute;
      top: 5px;
      left: 5px;
      background: var(--kick);
      color: #000;
      font-size: 0.62rem;
      font-weight: 900;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      display: none;
    }

    .upnext-card.active .upnext-badge-playing {
      display: inline-block;
    }

    .upnext-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .upnext-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .upnext-meta {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      font-size: 0.74rem;
      color: var(--text-dim);
    }

    /* Full Catalog Grid Below */
    .catalog-section {
      max-width: 1720px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .section-heading h2 {
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .kick-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--kick);
      box-shadow: 0 0 10px var(--kick);
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.1rem;
    }

    .vod-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
    }

    .vod-card:hover {
      transform: translateY(-3px);
      border-color: var(--kick);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    .vod-card.active {
      border-color: var(--kick);
      box-shadow: 0 0 0 2px var(--kick-glow);
    }

    .vod-card-thumb {
      position: relative;
      height: 162px;
      background: radial-gradient(circle at 20% 20%, #203819 0%, #0c0f12 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .vod-card-date {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(7, 8, 9, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 5px;
    }

    .vod-card-tag {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(7, 8, 9, 0.9);
      color: var(--kick);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.18rem 0.48rem;
      border-radius: 5px;
    }

    .vod-card-body {
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex: 1;
    }

    .vod-card-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .vod-card-sub {
      margin-top: auto;
      padding-top: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--text-dim);
    }

    @media (max-width: 1120px) {
      .watch-container {
        grid-template-columns: 1fr;
      }
      .secondary-col {
        position: static;
        max-height: 520px;
      }
    }

    @media (max-width: 720px) {
      .navbar {
        height: auto;
        padding: 0.75rem 1rem;
        flex-wrap: wrap;
      }
      .nav-center {
        order: 3;
        max-width: 100%;
        width: 100%;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

  <!-- Kick Styled Header -->
  <nav class="navbar">

  <script>
    // Block common inspect / save keyboard shortcuts (Ctrl+S, Ctrl+U, F12)
    document.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j'))
      ) {
        e.preventDefault();
        return false;
      }
    });

    let allVideos = [];
    let filteredVideos = [];
    let currentIndex = 0;

    function parseVideoMeta(item) {
      const cleanName = item.name.replace(/\.mp4$/i, '');
      const m = cleanName.match(/^(\d{4}-\d{2}-\d{2})\s*-\s*(.+)$/);
      return {
        id: item.id,
        date: m ? m[1] : (item.modifiedTime ? item.modifiedTime.slice(0, 10) : 'Tarihsiz'),
        title: m ? m[2].trim() : cleanName,
        size: Number(item.size || 0)
      };
    }

    function playById(id, scroll = false) {
      const idx = filteredVideos.findIndex(v => v.id === id);
      if (idx !== -1) {
        currentIndex = idx;
      }
      const v = filteredVideos[currentIndex] || allVideos.find(x => x.id === id);
      if (!v) return;

      document.getElementById('videoFrame').src = `https://drive.google.com/file/d/${v.id}/preview`;
      document.getElementById('currentTitle').textContent = v.title;
      document.getElementById('currentDateBadge').textContent = `Yayın Tarihi: ${v.date}`;

      document.querySelectorAll('[data-vid]').forEach(el => {
        el.classList.toggle('active', el.dataset.vid === v.id);
      });

      if (scroll) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function renderAll() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const sort = document.getElementById('sortSelect').value;

      filteredVideos = allVideos.filter(v =>
        v.title.toLowerCase().includes(q) || v.date.toLowerCase().includes(q)
      );

      filteredVideos.sort((a, b) => {
        if (sort === 'newest') return b.date.localeCompare(a.date) || b.title.localeCompare(a.title);
        if (sort === 'oldest') return a.date.localeCompare(b.date) || a.title.localeCompare(b.title);
        return 0;
      });

      document.getElementById('playlistCount').textContent = `${filteredVideos.length} VOD`;

      const currentId = (filteredVideos[currentIndex] || {}).id;

      // Render Right Sidebar (YouTube Up Next)
      const upNextEl = document.getElementById('upNextList');
      upNextEl.innerHTML = filteredVideos.map(v => `
        <div class="upnext-card ${v.id === currentId ? 'active' : ''}" data-vid="${v.id}">
          <div class="upnext-thumb">
            <span class="upnext-badge-playing">OYNATILIYOR</span>
            <div class="upnext-play-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 4 20 12 6 20 6 4"></polygon>
              </svg>
            </div>
            <span class="upnext-badge-hd">1080p60</span>
          </div>
          <div class="upnext-info">
            <div class="upnext-title">${v.title}</div>
            <div class="upnext-meta">
              <span>canbequit</span>
              <span>📅 ${v.date}</span>
            </div>
          </div>
        </div>
      `).join('');

      // Render Bottom Full Grid
      const gridEl = document.getElementById('catalogGrid');
      gridEl.innerHTML = filteredVideos.map(v => `
        <article class="vod-card ${v.id === currentId ? 'active' : ''}" data-vid="${v.id}">
          <div class="vod-card-thumb">
            <span class="vod-card-date">${v.date}</span>
            <div class="upnext-play-icon" style="width:48px;height:48px;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 4 20 12 6 20 6 4"></polygon>
              </svg>
            </div>
            <span class="vod-card-tag">1080p60 VOD</span>
          </div>
          <div class="vod-card-body">
            <div class="vod-card-title">${v.title}</div>
            <div class="vod-card-sub">
              <span>canbequit</span>
              <span>Sadece Sitede İzle</span>
            </div>
          </div>
        </article>
      `).join('');

      document.querySelectorAll('[data-vid]').forEach(card => {
        card.addEventListener('click', () => playById(card.dataset.vid, true));
      });
    }

    async function init() {
      try {
        const res = await fetch('videos.json?t=' + Date.now());
        const raw = await res.json();
        const seen = new Set();
        const list = [];
        for (const it of raw) {
          if (!it.name || !it.name.toLowerCase().endsWith('.mp4')) continue;
          if (seen.has(it.name)) continue;
          seen.add(it.name);
          list.push(parseVideoMeta(it));
        }
        allVideos = list.sort((a, b) => b.date.localeCompare(a.date));
        filteredVideos = [...allVideos];
        renderAll();
        if (filteredVideos.length > 0) {
          playById(filteredVideos[0].id, false);
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('searchInput').addEventListener('input', renderAll);
    document.getElementById('sortSelect').addEventListener('change', renderAll);

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (filteredVideos.length === 0) return;
      currentIndex = (currentIndex - 1 + filteredVideos.length) % filteredVideos.length;
      playById(filteredVideos[currentIndex].id, true);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (filteredVideos.length === 0) return;
      currentIndex = (currentIndex + 1) % filteredVideos.length;
      playById(filteredVideos[currentIndex].id, true);
    });

    document.getElementById('theaterBtn').addEventListener('click', function() {
      const c = document.getElementById('watchContainer');
      c.classList.toggle('theater-mode');
      this.classList.toggle('active');
    });

    init();
  </script>
</body>
</html>
